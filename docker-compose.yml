services:
  database_postgres:
    image: postgres:latest
    container_name: database_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql

  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@database_postgres:5432/${DB_NAME}?sslmode=disable
    depends_on:
      - database_postgres

volumes:
  postgres-data:
